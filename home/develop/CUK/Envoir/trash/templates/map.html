<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add a Map with Markers using HTML</title>
    <!-- ✅ Bootstrap (선택 사항, UI 구성할 때 유용) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- ✅ Google Maps JavaScript API -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDsipd6t0T5Q5ykmuSJGets1cRuvr5RnzQ&libraries=maps,marker"
      defer
    ></script>
    <!-- ✅ Google Maps Web Components -->
    <script
      async
      src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"
    ></script>
    <script
      async
      src="https://unpkg.com/@googlemaps/js-api-loader"
    ></script>
    <style>
      gmp-map {
        display: block;
        height: 500px;
        width: 100%;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mt-4">Google Map with Markers</h1>

      <!-- ✅ 단일 지도에 여러 마커 추가 -->
      <gmp-map
        center="43.4142989,-124.2301242"
        zoom="4"
        map-id="DEMO_MAP_ID"
      >
        <gmp-advanced-marker
          position="37.4220656,-122.0840897"
          title="Mountain View, CA"
        ></gmp-advanced-marker>
        <gmp-advanced-marker
          position="47.648994,-122.3503845"
          title="Seattle, WA"
        ></gmp-advanced-marker>
      </gmp-map>
    </div>
  </body>
</html>
